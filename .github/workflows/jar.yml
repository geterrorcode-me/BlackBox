name: Build Framework JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build Stub/Framework
        # Biasanya tasknya adalah :stub:assemble atau :core:assemble
        # Ganti sesuai nama module framework di repo tersebut
        run: ./gradlew :stub:jar 

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: framework-jar
          path: stub/build/libs/*.jar
          
