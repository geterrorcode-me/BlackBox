name: Build BlackBox VMecha - JDK 17 Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle 8.0
        run: |
          rm -rf gradle/wrapper
          mkdir -p gradle/wrapper
          # Menggunakan Gradle 8.0 agar support JDK 17 tanpa error 'major version 61'
          wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          wget -O gradlew https://github.com/gradle/gradle/raw/v8.0.0/gradlew
          chmod +x gradlew

      - name: Fix Repositories & AGP
        run: |
          # Hapus jcenter yang sudah mati
          find . -name "*.gradle" -exec sed -i 's/jcenter()//g' {} +
          find . -name "*.gradle" -exec sed -i 's/jCenter()//g' {} +
          
          # Upgrade AGP ke 8.1.0 agar kompatibel dengan JDK 17
          find . -name "build.gradle" -exec sed -i "s|com.android.tools.build:gradle:[^'\"]*|com.android.tools.build:gradle:8.1.0|g" {} +

      - name: Rewrite Settings & Dependency Mode
        run: |
          # Memaksa mode repositori agar tidak konflik saat resolusi library
          cat > settings.gradle << 'EOF'
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          include ':Bcore', ':stub'
          EOF

      - name: Smart Repackage (Protect Black/Stub)
        run: |
          OLD_PKG="top.niunaijun.blackbox"
          NEW_PKG="com.vmecha.vcore"
          OLD_PATH="top/niunaijun/blackbox"
          NEW_PATH="com/vmecha/vcore"

          # Hanya ganti package utama, jangan sentuh 'black.android.os'
          # Boundary \b memastikan 'blackbox' tidak tertukar dengan 'black'
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" -o -name "*.gradle" \) \
          -exec sed -i "s|\b$OLD_PKG\b|$NEW_PKG|g" {} +

          # Pindahkan folder fisik
          find . -type d -path "*/src/main/java/$OLD_PATH" | while read dir; do
            base=$(echo "$dir" | sed "s|/$OLD_PATH||")
            mkdir -p "$base/$NEW_PATH"
            cp -r "$dir/"* "$base/$NEW_PATH/" || true
            rm -rf "$dir"
          done

      - name: Fix Namespace (Required by AGP 8+)
        run: |
          # Bcore Namespace
          if [ -d Bcore ]; then
            sed -i 's/com.android.application/com.android.library/g' Bcore/build.gradle
            sed -i '/applicationId/d' Bcore/build.gradle
            sed -i '/android {/a \    namespace "com.vmecha.vcore"' Bcore/build.gradle
          fi
          # Stub Namespace (Tetap pakai black agar tidak NoClassDefFoundError)
          if [ -d stub ]; then
            sed -i '/android {/a \    namespace "black.android.os"' stub/build.gradle
          fi

      - name: Build with JDK 17
        run: |
          # Menjalankan build tanpa daemon agar lebih bersih di environment CI
          ./gradlew :stub:assembleRelease :Bcore:assembleRelease --stacktrace --no-daemon -x lint

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: vMecha-JDK17-Artifacts
          path: |
            Bcore/build/outputs/aar/*.aar
            stub/build/outputs/aar/*.aar
            stub/build/libs/*.jar
