name: Build BlackBox VMecha - Final Fix JDK 17

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle 8.0
        run: |
          rm -rf gradle/wrapper
          mkdir -p gradle/wrapper
          wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          wget -O gradlew https://github.com/gradle/gradle/raw/v8.0.0/gradlew
          chmod +x gradlew

      - name: Rewrite Root build.gradle (Define Ext Properties)
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.8.21'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.1.0"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }

          // Mendefinisikan properti yang dicari oleh sub-modul (seperti android-mirror)
          allprojects {
              ext {
                  compileSdkVersion = 33
                  minSdkVersion = 21
                  targetSdkVersion = 33
                  buildToolsVersion = "33.0.1"
              }
          }

          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

      - name: Rewrite Settings (Centralized Repos)
        run: |
          cat > settings.gradle << 'EOF'
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
              }
          }
          rootProject.name = "BlackBox"
          include ':Bcore'
          include ':Bcore:black-fake'
          include ':Bcore:black-hook'
          include ':Bcore:pine-xposed'
          include ':Bcore:pine-core'
          include ':Bcore:pine-xposed-res'
          include ':android-mirror'
          EOF

      - name: Smart Repackage (Refactor Only)
        run: |
          OLD_PKG="top.niunaijun.blackbox"
          NEW_PKG="com.vmecha.vcore"
          OLD_PATH="top/niunaijun/blackbox"
          NEW_PATH="com/vmecha/vcore"

          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" -o -name "*.gradle" \) \
          -exec sed -i "s|\b$OLD_PKG\b|$NEW_PKG|g" {} +

          for TYPE in "java" "aidl"; do
            find . -type d -path "*/src/main/$TYPE/$OLD_PATH" | while read dir; do
              base=$(echo "$dir" | sed "s|/$OLD_PATH||")
              mkdir -p "$base/$NEW_PATH"
              cp -r "$dir/"* "$base/$NEW_PATH/" || true
              rm -rf "$dir"
            done
          done

      - name: Fix Sub-Modules Namespace & Library Type
        run: |
          modules=("Bcore" "Bcore/black-fake" "Bcore/black-hook" "Bcore/pine-xposed" "Bcore/pine-core" "Bcore/pine-xposed-res" "android-mirror")
          
          for mod in "${modules[@]}"; do
            if [ -f "$mod/build.gradle" ]; then
              # Pastikan jadi library
              sed -i 's/com.android.application/com.android.library/g' "$mod/build.gradle"
              sed -i '/applicationId/d' "$mod/build.gradle"
              
              # Set Namespace unik
              suffix=$(echo $mod | sed 's|/|.|g')
              sed -i '/namespace /d' "$mod/build.gradle"
              sed -i "/android {/a \    namespace \"com.vmecha.vcore.$suffix\"" "$mod/build.gradle"
            fi
          done

      - name: Build Core Engine
        run: |
          ./gradlew :Bcore:assembleRelease --stacktrace --no-daemon -x lint

      - name: Upload Repackaged Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vMecha-VCore-AAR
          path: |
            **/build/outputs/aar/*.aar
            **/build/libs/*.jar
