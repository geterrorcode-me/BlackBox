name: Build Framework vMecha

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo lu
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Ambil framework.jar dari BlackBox
      run: |
        mkdir -p app/libs
        wget -O app/libs/framework.jar https://raw.githubusercontent.com/FBlackBox/BlackBox/master/lib/framework.jar
        echo "=== Isi framework.jar ==="
        jar tf app/libs/framework.jar | head -20

    - name: Cek framework.jar bener ga
      run: |
        if jar tf app/libs/framework.jar | grep -q "black/android/os/BRUserHandle.class"; then
          echo "framework.jar OK, ada BRUserHandle"
        else
          echo "framework.jar SALAH, ga ada BRUserHandle"
          exit 1
        fi

    - name: Grant gradlew permission
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VPhoneOS-KW-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload framework.jar buat jaga2
      uses: actions/upload-artifact@v4
      with:
        name: framework-jar
        path: app/libs/framework.jar
