name: Build BlackBox VMecha AAR - Final v9
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Force Downgrade Wrapper
        run: |
          find . -name "*.gradle" -exec sed -i 's/jcenter()//g' {} +
          find . -name "*.gradle" -exec sed -i 's/jCenter()//g' {} +
          mkdir -p gradle/wrapper
          wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          wget -O gradlew https://github.com/gradle/gradle/raw/v8.0.0/gradlew
          chmod +x gradlew

      - name: Patch Repositories & Settings
        run: |
          find . -name "build.gradle" -exec sed -i "s|com.android.tools.build:gradle:[^'\"]*|com.android.tools.build:gradle:8.1.0|g" {} +
          find . -name "build.gradle" -exec sed -i "s|org.jetbrains.kotlin:kotlin-gradle-plugin:[^'\"]*|org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10|g" {} +

          if [ -f "settings.gradle" ]; then
            cat > settings.gradle.tmp << 'EOF'
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
              }
          }
          EOF
            grep "include" settings.gradle >> settings.gradle.tmp
            mv settings.gradle.tmp settings.gradle
          fi

      - name: Global Refactor & Targetted R Fix
        run: |
          # 1. Aktifkan AIDL & CMake Project
          find . -name "build.gradle" -exec sed -i '/android {/a \    buildFeatures { aidl true }' {} +
          find . -name "CMakeLists.txt" -exec sed -i '/cmake_minimum_required/a project(VMechaNative)' {} +
          
          # 2. Namespace & Manifest Cleanup
          find . -name "AndroidManifest.xml" | while read manifest; do
            module_dir=$(dirname $(dirname $(dirname "$manifest")))
            pkg_name=$(grep -oP 'package="\K[^"]+' "$manifest" || echo "")
            if [ -n "$pkg_name" ] && [ -f "$module_dir/build.gradle" ]; then
              sed -i '/namespace /d' "$module_dir/build.gradle"
              sed -i "/android {/a \    namespace \"$pkg_name\"" "$module_dir/build.gradle"
              sed -i 's/package="[^"]*"//g' "$manifest"
            fi
          done

          # 3. SMART R-FIX (Hanya untuk modul Bcore)
          # Ganti import R lama ke baru di seluruh project
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i 's/top\.niunaijun\.blackbox\.R/com.vmecha.vcore.R/g' {} +
          
          # Hanya suntik import R ke file di dalam modul Bcore yang memanggil simbol R tapi tidak punya importnya
          if [ -d "Bcore/src/main/java" ]; then
            find Bcore/src/main/java -type f \( -name "*.java" -o -name "*.kt" \) | xargs grep -l "R\." | while read file; do
              if ! grep -q "import com.vmecha.vcore.R" "$file"; then
                sed -i '/package /a import com.vmecha.vcore.R;' "$file"
              fi
            done
          fi
          
          # 4. Refactor String Package Umum
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/black\.habakuk\.core/com.vmecha.vcore/g' {} +

          # 5. Fix AIDL Package Mismatch
          find . -name "*.aidl" | while read aidl_file; do
            relative_path=$(echo "$aidl_file" | sed -n 's|.*/aidl/||p' | xargs dirname | tr '/' '.')
            if [ -n "$relative_path" ]; then
              sed -i "s|^package .*|package $relative_path;|" "$aidl_file"
            fi
          done

      - name: Finalize Module Config
        run: |
          if [ -d "Bcore" ]; then
            cd Bcore
            sed -i 's/com.android.application/com.android.library/g' build.gradle
            sed -i '/applicationId/d' build.gradle
            sed -i 's/namespace "[^"]*"/namespace "com.vmecha.vcore"/g' build.gradle
            cd ..
          fi

      - name: Build Bcore AAR
        run: |
          ./gradlew :Bcore:assembleRelease -x lint --stacktrace --no-daemon

      - name: Upload VMecha AAR
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-blackbox-core
          path: Bcore/build/outputs/aar/*.aar
