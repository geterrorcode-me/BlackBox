name: Build BlackBox VMecha AAR - Fixed v10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================================================
      # FORCE GRADLE 8
      # =========================================================
      - name: Force Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper

          wget -O gradle/wrapper/gradle-wrapper.jar \
          https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          wget -O gradlew \
          https://github.com/gradle/gradle/raw/v8.0.0/gradlew

          chmod +x gradlew

      # =========================================================
      # PATCH REPOSITORIES
      # =========================================================
      - name: Patch Repositories
        run: |

          # remove jcenter
          find . -name "*.gradle" \
          -exec sed -i '/jcenter()/d' {} +

          find . -name "*.gradle" \
          -exec sed -i '/jCenter()/d' {} +

          # upgrade agp
          find . -name "*.gradle" \
          -exec sed -i \
          "s|com.android.tools.build:gradle:[^'\"]*|com.android.tools.build:gradle:8.1.0|g" {} +

          # upgrade kotlin
          find . -name "*.gradle" \
          -exec sed -i \
          "s|org.jetbrains.kotlin:kotlin-gradle-plugin:[^'\"]*|org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10|g" {} +

          # rewrite settings.gradle
          if [ -f settings.gradle ]; then

          cat > settings.gradle.tmp << 'EOF'
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
              }
          }
          EOF

          grep "include" settings.gradle >> settings.gradle.tmp

          mv settings.gradle.tmp settings.gradle

          fi

      # =========================================================
      # GLOBAL FIX
      # =========================================================
      - name: Global Refactor
        run: |

          # =====================================================
          # ENABLE AIDL
          # =====================================================

          find . -name "build.gradle" | while read file; do

            if grep -q "android {" "$file"; then

              if ! grep -q "buildFeatures" "$file"; then
                sed -i '/android {/a\
    buildFeatures {\n\
        aidl true\n\
    }' "$file"
              fi

            fi

          done

          # =====================================================
          # FIX CMAKE
          # =====================================================

          find . -name "CMakeLists.txt" | while read file; do

            if ! grep -q "project(" "$file"; then
              sed -i '1i project(VMechaNative)' "$file"
            fi

          done

          # =====================================================
          # MANIFEST + NAMESPACE FIX
          # =====================================================

          find . -name "AndroidManifest.xml" | while read manifest; do

            module_dir=$(dirname "$(dirname "$(dirname "$manifest")")")

            pkg_name=$(grep -oP 'package="\K[^"]+' "$manifest" || true)

            if [ -n "$pkg_name" ] && [ -f "$module_dir/build.gradle" ]; then

              sed -i '/namespace /d' "$module_dir/build.gradle"

              sed -i "/android {/a\
    namespace \"$pkg_name\"" "$module_dir/build.gradle"

              sed -i 's/package="[^"]*"//g' "$manifest"

            fi

          done

          # =====================================================
          # SAFE IMPORT REPLACE
          # =====================================================

          find . -type f \( -name "*.java" -o -name "*.kt" \) \
          -exec sed -i \
          's/import top\.niunaijun\.blackbox\.R;/import com.vmecha.vcore.R;/g' {} +

          # =====================================================
          # SAFE R IMPORT INJECTION (JAVA ONLY)
          # =====================================================

          if [ -d "Bcore/src/main/java" ]; then

            find Bcore/src/main/java -type f -name "*.java" | while read file; do

              if grep -q "R\." "$file"; then

                if ! grep -q "^import com\.vmecha\.vcore\.R;" "$file"; then

                  awk '
                  /^package / {
                    print
                    print "import com.vmecha.vcore.R;"
                    next
                  }

                  { print }
                  ' "$file" > "$file.tmp"

                  mv "$file.tmp" "$file"

                fi

              fi

            done

          fi

          # =====================================================
          # PACKAGE REFACTOR
          # =====================================================

          find . -type f \
          \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) \
          -exec sed -i \
          's/black\.habakuk\.core/com.vmecha.vcore/g' {} +

          # =====================================================
          # FIX AIDL PACKAGE
          # =====================================================

          find . -name "*.aidl" | while read aidl; do

            rel=$(echo "$aidl" | sed -n 's|.*/aidl/||p' | xargs dirname | tr '/' '.')

            if [ -n "$rel" ]; then
              sed -i "s|^package .*|package $rel;|" "$aidl"
            fi

          done

      # =========================================================
      # FINAL MODULE FIX
      # =========================================================
      - name: Finalize Bcore
        run: |

          if [ -d Bcore ]; then

            cd Bcore

            # app -> library
            sed -i \
            's/com.android.application/com.android.library/g' \
            build.gradle

            # remove applicationId
            sed -i '/applicationId/d' build.gradle

            # force namespace
            sed -i '/namespace /d' build.gradle

            sed -i '/android {/a\
    namespace "com.vmecha.vcore"' build.gradle

            cd ..

          fi

      # =========================================================
      # CLEAN BAD IMPORTS
      # =========================================================
      - name: Cleanup Broken Imports
        run: |

          find Bcore/src/main/java -name "*.java" | while read file; do

            awk '
            BEGIN { imported=0 }

            {
              if ($0 == "import com.vmecha.vcore.R;") {

                if (imported == 0) {
                  print
                  imported=1
                }

              } else {
                print
              }
            }
            ' "$file" > "$file.tmp"

            mv "$file.tmp" "$file"

          done

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build Bcore AAR
        run: |
          ./gradlew :Bcore:assembleRelease \
          --stacktrace \
          --no-daemon \
          -x lint

      # =========================================================
      # UPLOAD
      # =========================================================
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-blackbox-core
          path: Bcore/build/outputs/aar/*.aar
