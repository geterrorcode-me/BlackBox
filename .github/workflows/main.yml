name: Build BlackBox AAR
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Upgrade Gradle Wrapper
        # Kita paksa upgrade ke Gradle 8.0 karena Gradle 6.5 tidak dukung Java 17
        run: |
          gradle wrapper --gradle-version 8.0 --distribution-type all

      - name: Patch Bcore for AAR
        run: |
          # Masuk ke folder Bcore (Core mesin BlackBox)
          cd Bcore
          
          # Ubah plugin dari Application menjadi Library
          sed -i 's/id "com.android.application"/id "com.android.library"/g' build.gradle 2>/dev/null || true
          sed -i 's/apply plugin: "com.android.application"/apply plugin: "com.android.library"/g' build.gradle 2>/dev/null || true
          
          # Hapus applicationId (wajib untuk AAR)
          sed -i '/applicationId/d' build.gradle
          
          # Rename Package (Optional: Sesuaikan dengan VMecha)
          # BlackBox aslinya pakai black.habakuk.core
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/black\.habakuk\.core/com.vmecha.vcore/g' {} +
          
          # Pastikan namespace diatur untuk Gradle 8
          # Kita tambahkan baris namespace jika belum ada
          sed -i '/android {/a \    namespace "com.vmecha.vcore"' build.gradle

      - name: Global String Replacement
        run: |
          # Ganti semua sisa string lama di seluruh project root
          find . -maxdepth 4 -type f -not -path '*/.*' -exec sed -i 's/black\.habakuk\.core/com.vmecha.vcore/g' {} +

      - name: Build Bcore AAR
        run: |
          chmod +x gradlew
          # Kita hanya mem-build modul Bcore saja agar cepat dan bersih
          ./gradlew :Bcore:assembleRelease --stacktrace --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-blackbox-core
          path: Bcore/build/outputs/aar/*.aar
