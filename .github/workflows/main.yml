name: Build BlackBox AAR
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Force Downgrade Wrapper (Manual Bypass)
        run: |
          # Hapus jcenter agar tidak ada error saat script di-scan
          find . -name "*.gradle" -exec sed -i 's/jcenter()//g' {} +
          find . -name "*.gradle" -exec sed -i 's/jCenter()//g' {} +
          
          # Kita tidak pakai 'gradle wrapper' bawaan sistem (v9)
          # Kita download langsung wrapper jar versi 8.0
          mkdir -p gradle/wrapper
          wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar
          
          # Buat file gradle-wrapper.properties secara manual
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          # Pastikan file gradlew ada (ambil dari repo atau buat baru)
          if [ ! -f gradlew ]; then
            wget -O gradlew https://github.com/gradle/gradle/raw/v8.0.0/gradlew
          fi
          chmod +x gradlew
          echo "Force downgraded to Gradle 8.0 wrapper successfully."

      - name: Patch Bcore for AAR
        run: |
          # Tambahkan repo standar jika hilang
          find . -name "*.gradle" -exec sed -i '/repositories {/a \        google()\n        mavenCentral()' {} +

          cd Bcore
          # Ubah plugin ke library
          sed -i 's/id "com.android.application"/id "com.android.library"/g' build.gradle 2>/dev/null || true
          sed -i 's/apply plugin: "com.android.application"/apply plugin: "com.android.library"/g' build.gradle 2>/dev/null || true
          
          # Setup Namespace dan hapus ID
          sed -i '/applicationId/d' build.gradle
          sed -i '/android {/a \    namespace "com.vmecha.vcore"' build.gradle
          
          # Refactor package
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/black\.habakuk\.core/com.vmecha.vcore/g' {} +

      - name: Build Bcore AAR
        run: |
          # Sekarang jalankan pakai ./gradlew (8.0), BUKAN 'gradle' (9.4)
          ./gradlew :Bcore:assembleRelease --stacktrace --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-blackbox-core
          path: Bcore/build/outputs/aar/*.aar
          
