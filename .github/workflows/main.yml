name: Build BlackBox AAR
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Force Downgrade Wrapper (Manual Bypass)
        run: |
          # 1. Bersihkan jcenter()
          find . -name "*.gradle" -exec sed -i 's/jcenter()//g' {} +
          find . -name "*.gradle" -exec sed -i 's/jCenter()//g' {} +
          
          # 2. Setup Wrapper 8.0 manual
          mkdir -p gradle/wrapper
          wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          wget -O gradlew https://github.com/gradle/gradle/raw/v8.0.0/gradlew
          chmod +x gradlew

      - name: Patch Root and Bcore for Compatibility
        run: |
          # 3. Paksa Android Gradle Plugin ke versi 8.1.0 agar kompatibel dengan Gradle 8 & Java 17
          # Kita cari baris classpath 'com.android.tools.build:gradle:...' dan ganti
          find . -name "build.gradle" -exec sed -i 's/com\.android\.tools\.build:gradle:[^'\'封'\"']*/com.android.tools.build:gradle:8.1.0/g' {} +

          # 4. Tambahkan repositori wajib
          find . -name "*.gradle" -exec sed -i '/repositories {/a \        google()\n        mavenCentral()' {} +

          # 5. Konfigurasi Bcore sebagai Library
          cd Bcore
          sed -i 's/id "com.android.application"/id "com.android.library"/g' build.gradle 2>/dev/null || true
          sed -i 's/apply plugin: "com.android.application"/apply plugin: "com.android.library"/g' build.gradle 2>/dev/null || true
          sed -i '/applicationId/d' build.gradle
          
          # 6. Setup Namespace (Wajib di AGP 8.x)
          sed -i '/android {/a \    namespace "com.vmecha.vcore"' build.gradle
          
          # 7. Refactor package
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/black\.habakuk\.core/com.vmecha.vcore/g' {} +

      - name: Build Bcore AAR
        run: |
          # Gunakan --no-build-cache untuk menghindari konflik sisa build sebelumnya
          ./gradlew :Bcore:assembleRelease --stacktrace --no-daemon --no-build-cache

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-blackbox-core
          path: Bcore/build/outputs/aar/*.aar
