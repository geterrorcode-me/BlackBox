name: Build BlackBox AAR
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Force Downgrade Wrapper
        run: |
          find . -name "*.gradle" -exec sed -i 's/jcenter()//g' {} +
          find . -name "*.gradle" -exec sed -i 's/jCenter()//g' {} +
          
          mkdir -p gradle/wrapper
          wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          wget -O gradlew https://github.com/gradle/gradle/raw/v8.0.0/gradlew
          chmod +x gradlew

      - name: Patch All Modules for AGP 8.x
        run: |
          # 1. Paksa AGP ke 8.1.0 di seluruh project
          find . -name "build.gradle" -exec sed -i "s|com.android.tools.build:gradle:[^'\"]*|com.android.tools.build:gradle:8.1.0|g" {} +

          # 2. Tambahkan repo Google & MavenCentral ke semua file gradle
          find . -name "*.gradle" -exec sed -i '/repositories {/a \        google()\n        mavenCentral()' {} +

          # 3. FIX NAMESPACE OTOMATIS: 
          # Mencari file AndroidManifest.xml, mengambil nilai package-nya, 
          # lalu memasukkannya sebagai namespace di build.gradle modul tersebut.
          find . -name "AndroidManifest.xml" | while read manifest; do
            module_dir=$(dirname $(dirname $(dirname "$manifest")))
            pkg_name=$(grep -oP 'package="\K[^"]+' "$manifest" || echo "")
            
            if [ -n "$pkg_name" ] && [ -f "$module_dir/build.gradle" ]; then
              # Hapus namespace lama jika ada untuk menghindari duplikat
              sed -i '/namespace /d' "$module_dir/build.gradle"
              # Masukkan namespace baru tepat di bawah 'android {'
              sed -i "/android {/a \    namespace \"$pkg_name\"" "$module_dir/build.gradle"
              echo "Set namespace $pkg_name for $module_dir"
            fi
          done

          # 4. Konfigurasi Bcore sebagai Library & Refactor ke VMecha
          if [ -d "Bcore" ]; then
            cd Bcore
            sed -i 's/com.android.application/com.android.library/g' build.gradle
            sed -i '/applicationId/d' build.gradle
            # Ganti namespace Bcore khusus ke vmecha
            sed -i 's/namespace "[^"]*"/namespace "com.vmecha.vcore"/g' build.gradle
            
            find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/black\.habakuk\.core/com.vmecha.vcore/g' {} +
            cd ..
          fi

      - name: Build Bcore AAR
        run: |
          ./gradlew :Bcore:assembleRelease --stacktrace --no-daemon --no-build-cache

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-blackbox-core
          path: Bcore/build/outputs/aar/*.aar
