name: Build BlackBox VMecha AAR - Full Fix v5
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Force Downgrade Wrapper
        run: |
          find . -name "*.gradle" -exec sed -i 's/jcenter()//g' {} +
          find . -name "*.gradle" -exec sed -i 's/jCenter()//g' {} +
          mkdir -p gradle/wrapper
          wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          wget -O gradlew https://github.com/gradle/gradle/raw/v8.0.0/gradlew
          chmod +x gradlew

      - name: Patch All Modules & Repositories
        run: |
          # 1. Update AGP & Kotlin
          find . -name "build.gradle" -exec sed -i "s|com.android.tools.build:gradle:[^'\"]*|com.android.tools.build:gradle:8.1.0|g" {} +
          find . -name "build.gradle" -exec sed -i "s|org.jetbrains.kotlin:kotlin-gradle-plugin:[^'\"]*|org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10|g" {} +

          # 2. Repositories
          sed -i '/repositories {/a \        google()\n        mavenCentral()\n        maven { url "https://jitpack.io" }' build.gradle

          # 3. Aktifkan AIDL & CMake Project Fix
          find . -name "build.gradle" -exec sed -i '/android {/a \    buildFeatures { aidl true }' {} +
          find . -name "CMakeLists.txt" -exec sed -i '/cmake_minimum_required/a project(VMechaNative)' {} +

          # 4. Global Namespace & Manifest Cleanup
          find . -name "AndroidManifest.xml" | while read manifest; do
            module_dir=$(dirname $(dirname $(dirname "$manifest")))
            pkg_name=$(grep -oP 'package="\K[^"]+' "$manifest" || echo "")
            if [ -n "$pkg_name" ] && [ -f "$module_dir/build.gradle" ]; then
              sed -i '/namespace /d' "$module_dir/build.gradle"
              sed -i "/android {/a \    namespace \"$pkg_name\"" "$module_dir/build.gradle"
              sed -i 's/package="[^"]*"//g' "$manifest"
            fi
          done

      - name: Fix AIDL Package Mismatch
        run: |
          # Masalah: AIDL compiler protes karena folder vs package tidak cocok.
          # Kita paksa semua deklarasi package di dalam file AIDL mengikuti path foldernya.
          find . -name "*.aidl" | while read aidl_file; do
            # Ambil path relatif dari folder 'aidl'
            # Contoh: top/niunaijun/blackbox/entity/location
            relative_path=$(echo "$aidl_file" | sed -n 's|.*/aidl/||p' | xargs dirname | tr '/' '.')
            
            if [ -n "$relative_path" ]; then
              # Ganti baris 'package ...;' dengan path folder yang benar
              sed -i "s|^package .*|package $relative_path;|" "$aidl_file"
            fi
          done
          echo "AIDL packages synced with folder structure."

      - name: Refactor to VMecha
        run: |
          if [ -d "Bcore" ]; then
            cd Bcore
            sed -i 's/com.android.application/com.android.library/g' build.gradle
            sed -i '/applicationId/d' build.gradle
            sed -i 's/namespace "[^"]*"/namespace "com.vmecha.vcore"/g' build.gradle
            
            # Refactor Package Strings (Hati-hati: ini merubah deklarasi AIDL juga)
            find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/black\.habakuk\.core/com.vmecha.vcore/g' {} +
            cd ..
          fi

      - name: Build Bcore AAR
        run: |
          ./gradlew :Bcore:assembleRelease -x lint --stacktrace --no-daemon --refresh-dependencies

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-blackbox-core
          path: Bcore/build/outputs/aar/*.aar
