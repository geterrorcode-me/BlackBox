name: Build BlackBox VMecha AAR - Full Repackage

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle Wrapper
        run: |
          rm -rf gradle/wrapper

          mkdir -p gradle/wrapper

          wget -O gradle/wrapper/gradle-wrapper.jar \
          https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          wget -O gradlew \
          https://github.com/gradle/gradle/raw/v8.0.0/gradlew

          chmod +x gradlew

      - name: Clean Repositories
        run: |
          find . -name "*.gradle" -exec sed -i 's/jcenter()//g' {} +
          find . -name "*.gradle" -exec sed -i 's/jCenter()//g' {} +

      - name: Upgrade AGP & Kotlin
        run: |
          find . -name "build.gradle" -exec sed -i \
          "s|com.android.tools.build:gradle:[^'\"]*|com.android.tools.build:gradle:8.1.0|g" {} +

          find . -name "build.gradle" -exec sed -i \
          "s|org.jetbrains.kotlin:kotlin-gradle-plugin:[^'\"]*|org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10|g" {} +

      - name: Rewrite Settings Gradle
        run: |
          if [ -f settings.gradle ]; then

            cp settings.gradle settings.gradle.bak

            cat > settings.gradle << 'EOF'
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
              }
          }
          EOF

            grep "include" settings.gradle.bak >> settings.gradle || true

          fi

      - name: Enable AIDL & Native
        run: |
          find . -name "build.gradle" | while read file; do

            if grep -q "android {" "$file"; then

              sed -i '/android {/a\
              buildFeatures {\
                  aidl true\
              }' "$file"

            fi

          done

          find . -name "CMakeLists.txt" | while read cmake; do

            if ! grep -q "project(" "$cmake"; then
              sed -i '/cmake_minimum_required/a\
          project(VMechaNative)' "$cmake"
            fi

          done

      - name: Full Package Refactor
        run: |

          OLD_PKG="top.niunaijun.blackbox"
          NEW_PKG="com.vmecha.vcore"

          OLD_PATH="top/niunaijun/blackbox"
          NEW_PATH="com/vmecha/vcore"

          echo "==============================="
          echo "GLOBAL STRING REPLACE"
          echo "==============================="

          find . -type f \( \
            -name "*.java" -o \
            -name "*.kt" -o \
            -name "*.xml" -o \
            -name "*.aidl" -o \
            -name "*.gradle" -o \
            -name "*.pro" \
          \) -exec sed -i "s|$OLD_PKG|$NEW_PKG|g" {} +

          echo "==============================="
          echo "MOVE JAVA SOURCE"
          echo "==============================="

          find . -type d -path "*/src/main/java/$OLD_PATH" | while read dir; do

            base=$(echo "$dir" | sed "s|/$OLD_PATH||")

            mkdir -p "$base/$NEW_PATH"

            cp -r "$dir/"* "$base/$NEW_PATH/" || true

            rm -rf "$dir"

          done

          echo "==============================="
          echo "MOVE KOTLIN SOURCE"
          echo "==============================="

          find . -type d -path "*/src/main/kotlin/$OLD_PATH" | while read dir; do

            base=$(echo "$dir" | sed "s|/$OLD_PATH||")

            mkdir -p "$base/$NEW_PATH"

            cp -r "$dir/"* "$base/$NEW_PATH/" || true

            rm -rf "$dir"

          done

          echo "==============================="
          echo "MOVE AIDL SOURCE"
          echo "==============================="

          find . -type d -path "*/src/main/aidl/$OLD_PATH" | while read dir; do

            base=$(echo "$dir" | sed "s|/$OLD_PATH||")

            mkdir -p "$base/$NEW_PATH"

            cp -r "$dir/"* "$base/$NEW_PATH/" || true

            rm -rf "$dir"

          done

      - name: Fix Android Manifest
        run: |

          find . -name "AndroidManifest.xml" | while read manifest; do

            module_dir=$(dirname $(dirname $(dirname "$manifest")))

            sed -i 's/package="[^"]*"//g' "$manifest"

            if [ -f "$module_dir/build.gradle" ]; then

              sed -i '/namespace /d' "$module_dir/build.gradle"

              sed -i '/android {/a\
              namespace "com.vmecha.vcore"' \
              "$module_dir/build.gradle"

            fi

          done

      - name: Fix AIDL Packages
        run: |

          find . -name "*.aidl" | while read aidl; do

            relative=$(echo "$aidl" | \
            sed -n 's|.*/aidl/||p' | \
            xargs dirname | tr '/' '.')

            if [ -n "$relative" ]; then
              sed -i "s|^package .*|package $relative;|" "$aidl"
            fi

          done

      - name: Convert Bcore To Library
        run: |

          if [ -d Bcore ]; then

            cd Bcore

            sed -i \
            's/com.android.application/com.android.library/g' \
            build.gradle

            sed -i '/applicationId/d' build.gradle

            sed -i '/namespace /d' build.gradle

            sed -i '/android {/a\
            namespace "com.vmecha.vcore"' \
            build.gradle

            cd ..

          fi

      - name: Remove Old Imports
        run: |

          find . -type f \( \
            -name "*.java" -o \
            -name "*.kt" \
          \) -exec sed -i \
          '/import top\.niunaijun\.blackbox\.R/d' {} +

      - name: Verify Remaining Old Package
        run: |

          echo "==============================="
          echo "CHECK REMAINING OLD PACKAGE"
          echo "==============================="

          grep -R "top.niunaijun.blackbox" . || true

      - name: Build Release AAR
        run: |
          ./gradlew :Bcore:assembleRelease \
          --stacktrace \
          --no-daemon \
          -x lint

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-blackbox-core
          path: Bcore/build/outputs/aar/*.aar
