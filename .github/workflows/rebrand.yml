name: Build BlackBox VMecha AAR
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto Generate settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
                  maven { url "https://maven.aliyun.com/repository/public" }
                  maven { url "https://maven.aliyun.com/repository/central" }
                  maven { url "https://maven.aliyun.com/repository/google" }
              }
          }
          rootProject.name = "VMecha"
          EOF
          
          find . -name "build.gradle" -not -path "./build.gradle" -not -path "./app/build.gradle" | while read file; do
            dir=$(dirname "$file" | sed 's|^\./||')
            echo "include ':$dir'" >> settings.gradle
          done
          sed -i 's|/:|:|g' settings.gradle
          sed -i 's|/|🜲|g' settings.gradle
          sed -i 's|🜲|:|g' settings.gradle

      - name: Overwrite Root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
              id 'com.android.library' version '8.1.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
          }
          
          ext {
              compileSdkVersion = 34
              minSdkVersion = 21
              targetSdkVersion = 34
              versionCode = 1
              versionName = "1.0"
              kotlin_version = "1.8.10"
          }
          EOF

      - name: Setup Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          wget -O gradlew https://github.com/gradle/gradle/raw/v8.0.0/gradlew
          chmod +x gradlew

      - name: Clean Sub-Module Gradle
        run: |
          find . -name "build.gradle" -not -path "./build.gradle" -not -path "./app/build.gradle" -exec sed -i '/buildscript {/,/}/d' {} +
          find . -name "build.gradle" -not -path "./build.gradle" -not -path "./app/build.gradle" -exec sed -i '/repositories {/,/}/d' {} +
          find . -name "build.gradle" -not -path "./build.gradle" -not -path "./app/build.gradle" -exec sed -i '/allprojects {/,/}/d' {} +
          find . -name "build.gradle" -not -path "./app/build.gradle" -exec sed -i '/android {/a \    buildFeatures { aidl true }' {} +
          find . -name "build.gradle" -exec sed -i '/buildToolsVersion/d' {} +
          find . -name "build.gradle" -exec sed -i '/tasks.withType(Javadoc)/, /}/d' {} +
          find . -name "build.gradle" -exec sed -i '/tasks.withType(DokkaTask)/, /}/d' {} +
          find . -name "build.gradle" -exec sed -i '/javadoc {/ , /}/d' {} +
          find . -name "build.gradle" -exec sed -i '/publishing {/ , /}/d' {} +
          # Fix free-reflection: underscore -> dash + hardcode versi
          find . -name "build.gradle" -exec sed -i 's|me.weishu:free_reflection:3.0.1|me.weishu:free-reflection:3.0.1|g' {} +
          find . -name "build.gradle" -exec sed -i 's|com.github.CodingGay.BlackReflection:core:$rootProject.ext.blackReflection|me.weishu:free-reflection:3.0.1|g' {} +
          find . -name "build.gradle" -exec sed -i 's|com.github.CodingGay.BlackReflection:core:$blackReflection|me.weishu:free-reflection:3.0.1|g' {} +
          find . -name "build.gradle" -exec sed -i 's|org.ow2.asm:asm:$rootProject.ext.asm_version|org.ow2.asm:asm:9.2|g' {} +
          find . -name "build.gradle" -exec sed -i '/if (!rootProject.ext.blackReflection)/, /}/d' {} +
          find . -name "build.gradle" -exec sed -i '/if (rootProject.ext.useAsm)/, /}/d' {} +

      - name: Rebrand Source Code
        run: |
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/top\.niunaijun\.blackbox/com.vmecha.vcore/g' {} +
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/top\/niunaijun\/blackbox/com\/vmecha\/vcore/g' {} +
          find . -type d -path "*/top/niunaijun/blackbox" | while read dir; do
            newdir=$(echo $dir | sed 's/top\/niunaijun\/blackbox/com\/vmecha\/vcore/g')
            mkdir -p $(dirname $newdir)
            mv $dir $newdir 2>/dev/null || true
          done

      - name: Force Inject Namespace All Modules
        run: |
          find . -name "build.gradle" -not -path "./build.gradle" -not -path "./app/build.gradle" | while read gradle_file; do
            if grep -q "android {" "$gradle_file"; then
              module_dir=$(dirname "$gradle_file")
              manifest="$module_dir/src/main/AndroidManifest.xml"
              
              if [ -f "$manifest" ]; then
                pkg=$(grep -oP 'package="\K[^"]+' "$manifest" || echo "")
                sed -i 's/package="[^"]*"//g' "$manifest"
              fi
              
              if [ -z "$pkg" ]; then
                pkg="com.vmecha.vcore.$(basename $module_dir | tr '-' '_' | tr '[:upper:]' '[:lower:]')"
              fi
              
              sed -i '/namespace /d' "$gradle_file"
              sed -i "/android {/a \    namespace \"$pkg\"" "$gradle_file"
            fi
          done

      - name: Finalize Bcore
        run: |
          cd Bcore
          sed -i 's/com.android.application/com.android.library/g' build.gradle
          sed -i '/applicationId/d' build.gradle
          sed -i '/namespace /d' build.gradle
          sed -i "/android {/a \    namespace \"com.vmecha.vcore\"" build.gradle

      - name: Build Bcore AAR
        run: ./gradlew :Bcore:assembleRelease -x lint --stacktrace --no-daemon

      - name: Repack to com.vmecha.vcore
        run: |
          AAR=$(find Bcore/build/outputs/aar -name "*.aar" | head -1)
          wget -q https://repo1.maven.org/maven2/com/googlecode/jarjar/jarjar/1.4/jarjar-1.4.jar
          rm -rf temp_aar && mkdir temp_aar && cd temp_aar
          unzip -q ../$AAR
          echo "rule top.niunaijun.blackbox.** com.vmecha.vcore.@1" > rules.txt
          java -jar ../jarjar-1.4.jar process rules.txt classes.jar classes-new.jar
          mv classes-new.jar classes.jar
          sed -i 's/package="top.niunaijun.blackbox"/package="com.vmecha.vcore"/g' AndroidManifest.xml
          zip -r -q ../vmecha-vm.aar .

      - name: Upload VMecha AAR
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-vm-aar
          path: vmecha-vm.aar
