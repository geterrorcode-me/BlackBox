name: Build BlackBox VMecha AAR
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto Generate settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
                  maven { url "https://maven.aliyun.com/repository/public" }
                  maven { url "https://maven.aliyun.com/repository/central" }
                  maven { url "https://maven.aliyun.com/repository/google" }
              }
          }
          rootProject.name = "VMecha"
          EOF
          
          # Mencari semua direktori yang berisi build.gradle (kecuali root dan app)
          find . -name "build.gradle" -not -path "./build.gradle" -not -path "./app/build.gradle" | while read file; do
            dir=$(dirname "$file" | sed 's|^\./||')
            echo "include ':$dir'" >> settings.gradle
          done
          # Perbaikan format path ke format gradle project :path:subpath
          sed -i 's|/|:|g' settings.gradle

      - name: Overwrite Root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
              id 'com.android.library' version '8.1.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
          }
          
          ext {
              compileSdkVersion = 34
              minSdkVersion = 21
              targetSdkVersion = 34
              versionCode = 1
              versionName = "1.0"
              kotlin_version = "1.8.10"
              // Menambahkan properti yang hilang agar build tidak crash saat evaluasi
              blackReflection = "1.1.2"
              asm_version = "9.2"
          }
          EOF

      - name: Setup Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          wget -O gradlew https://github.com/gradle/gradle/raw/v8.0.0/gradlew
          chmod +x gradlew

      - name: Clean Sub-Module Gradle
        run: |
          # Hapus blokir buildscript/repositories yang sering bikin konflik di sub-modul
          find . -name "build.gradle" -not -path "./build.gradle" -exec sed -i '/buildscript {/,/}/d' {} +
          find . -name "build.gradle" -not -path "./build.gradle" -exec sed -i '/repositories {/,/}/d' {} +
          
          # Pastikan AIDL aktif
          find . -name "build.gradle" -not -path "./build.gradle" -exec sed -i '/android {/a \    buildFeatures { aidl true }' {} +
          
          # Migrasi BlackReflection ke FreeReflection milik Weishu (lebih stabil untuk Android baru)
          find . -name "build.gradle" -exec sed -i 's|com.github.CodingGay:BlackReflection:1.1.2|me.weishu:free-reflection:3.0.1|g' {} +
          find . -name "build.gradle" -exec sed -i 's|com.github.CodingGay.BlackReflection:core:.*|me.weishu:free-reflection:3.0.1|g' {} +
          find . -name "build.gradle" -exec sed -i 's|org.ow2.asm:asm:.*|org.ow2.asm:asm:9.2|g' {} +

      - name: Rebrand Source Code
        run: |
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/top\.niunaijun\.blackbox/com.vmecha.vcore/g' {} +
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/top\/niunaijun\/blackbox/com\/vmecha\/vcore/g' {} +

      - name: Force Inject Namespace
        run: |
          find . -name "build.gradle" -not -path "./build.gradle" | while read gradle_file; do
            if grep -q "android {" "$gradle_file"; then
              module_name=$(basename $(dirname "$gradle_file") | tr '-' '_' | tr '[:upper:]' '[:lower:]')
              pkg="com.vmecha.vcore.$module_name"
              # Hapus namespace lama jika ada dan suntikkan yang baru
              sed -i '/namespace /d' "$gradle_file"
              sed -i "/android {/a \    namespace \"$pkg\"" "$gradle_file"
            fi
          done

      - name: Finalize Bcore (Main Target)
        run: |
          if [ -d "Bcore" ]; then
            cd Bcore
            sed -i 's/com.android.application/com.android.library/g' build.gradle
            sed -i '/applicationId/d' build.gradle
            sed -i '/namespace /d' build.gradle
            sed -i "/android {/a \    namespace \"com.vmecha.vcore\"" build.gradle
          fi

      - name: Build Bcore AAR
        run: ./gradlew :Bcore:assembleRelease -x lint --stacktrace

      - name: Repack AAR
        run: |
          AAR_PATH=$(find Bcore/build/outputs/aar -name "*release.aar" | head -1)
          if [ -z "$AAR_PATH" ]; then echo "AAR not found!"; exit 1; fi
          cp "$AAR_PATH" vmecha-vm.aar

      - name: Upload VMecha AAR
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-vm-aar
          path: vmecha-vm.aar
