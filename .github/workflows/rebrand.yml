name: VMecha AAR
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Overwrite Root Gradle Files
        run: |
          # 1. Timpa settings.gradle
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "VMecha"
          include ':Bcore'
          include ':app'
          include ':android-mirror'
          include ':hidden-api'
          EOF

          # 2. Timpa build.gradle root - ini fix error kurung }
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
              id 'com.android.library' version '8.1.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
          }
          EOF

      - name: Setup Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          wget -O gradlew https://github.com/gradle/gradle/raw/v8.0.0/gradlew
          chmod +x gradlew

      - name: Refactor Source Code
        run: |
          # 1. Hapus block conflict di semua sub-module
          find . -name "build.gradle" -not -path "./build.gradle" -exec sed -i '/buildscript {/,/}/d' {} +
          find . -name "build.gradle" -not -path "./build.gradle" -exec sed -i '/repositories {/,/}/d' {} +
          find . -name "build.gradle" -not -path "./build.gradle" -exec sed -i '/allprojects {/,/}/d' {} +
          
          # 2. Aktifkan AIDL
          find . -name "build.gradle" -exec sed -i '/android {/a \    buildFeatures { aidl true }' {} +
          
          # 3. Ganti package di source
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/top\.niunaijun\.blackbox/com.vmecha.vcore/g' {} +
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/top\/niunaijun\/blackbox/com\/vmecha\/vcore/g' {} +
          
          # 4. Rename folder
          find . -type d -path "*/top/niunaijun/blackbox" | while read dir; do
            newdir=$(echo $dir | sed 's/top\/niunaijun\/blackbox/com\/vmecha\/vcore/g')
            mkdir -p $(dirname $newdir)
            mv $dir $newdir 2>/dev/null || true
          done
          
          # 5. Fix AIDL
          find . -name "*.aidl" | while read aidl_file; do
            relative_path=$(echo "$aidl_file" | sed -n 's|.*/aidl/||p' | xargs dirname | tr '/' '.')
            if [ -n "$relative_path" ]; then
              sed -i "s|^package .*|package $relative_path;|" "$aidl_file"
            fi
          done

      - name: Inject Namespace
        run: |
          find . -name "AndroidManifest.xml" | while read manifest; do
            module_dir=$(dirname $(dirname "$manifest"))
            if [ -f "$module_dir/build.gradle" ]; then
              pkg=$(grep -oP 'package="\K[^"]+' "$manifest" || echo "com.vmecha.vcore.$(basename $module_dir | tr '-' '_')")
              sed -i 's/package="[^"]*"//g' "$manifest"
              if ! grep -q "namespace" "$module_dir/build.gradle"; then
                sed -i "/android {/a \    namespace \"$pkg\"" "$module_dir/build.gradle"
              else
                sed -i "s|namespace \"[^\"]*\"|namespace \"$pkg\"|g" "$module_dir/build.gradle"
              fi
            fi
          done

      - name: Finalize Bcore
        run: |
          cd Bcore
          sed -i 's/com.android.application/com.android.library/g' build.gradle
          sed -i '/applicationId/d' build.gradle
          sed -i 's/namespace "[^"]*"/namespace "com.vmecha.vcore"/g' build.gradle

      - name: Build AAR
        run: ./gradlew :Bcore:assembleRelease -x lint --stacktrace --no-daemon

      - name: Repack to com.vmecha.vcore
        run: |
          AAR=$(find Bcore/build/outputs/aar -name "*.aar" | head -1)
          wget -q https://repo1.maven.org/maven2/com/googlecode/jarjar/jarjar/1.4/jarjar-1.4.jar
          rm -rf temp_aar && mkdir temp_aar && cd temp_aar
          unzip -q ../$AAR
          echo "rule top.niunaijun.blackbox.** com.vmecha.vcore.@1" > rules.txt
          java -jar ../jarjar-1.4.jar process rules.txt classes.jar classes-new.jar
          mv classes-new.jar classes.jar
          sed -i 's/package="top.niunaijun.blackbox"/package="com.vmecha.vcore"/g' AndroidManifest.xml
          zip -r -q ../vmecha-vm.aar .
          cd ..

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-vm-aar
          path: vmecha-vm.aar
