name: Build BlackBox VMecha AAR
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto Generate settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
                  maven { url "https://maven.aliyun.com/repository/public" }
                  maven { url "https://maven.aliyun.com/repository/central" }
                  maven { url "https://maven.aliyun.com/repository/google" }
              }
          }
          rootProject.name = "VMecha"
          EOF
          
          find . -name "build.gradle" -not -path "./build.gradle" -not -path "./app/build.gradle" | while read file; do
            dir=$(dirname "$file" | sed 's|^\./||')
            echo "include ':$dir'" >> settings.gradle
          done
          sed -i 's|/|:|g' settings.gradle

      - name: Overwrite Root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
              id 'com.android.library' version '8.1.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
          }
          
          ext {
              compileSdkVersion = 34
              minSdkVersion = 21
              targetSdkVersion = 34
              versionCode = 1
              versionName = "1.0"
              kotlin_version = "1.8.10"
              blackReflection = "1.1.2"
              asm_version = "9.2"
          }
          EOF

      - name: Clean and Precise Fix Gradle
        run: |
          # 1. Hapus blokir yang tidak perlu
          find . -name "build.gradle" -not -path "./build.gradle" -exec sed -i '/buildscript {/,/}/d' {} +
          find . -name "build.gradle" -not -path "./build.gradle" -exec sed -i '/repositories {/,/}/d' {} +
          
          # 2. FIX KRITIKAL: Mengganti library dengan memastikan quote penutup tetap ada
          # Kita mencari string yang dimulai dengan com.github.CodingGay dan mengganti seluruh isi di dalam quote
          find . -name "build.gradle" -exec sed -i 's|com.github.CodingGay:BlackReflection:[^"]*|me.weishu:free-reflection:3.0.1|g' {} +
          find . -name "build.gradle" -exec sed -i 's|com.github.CodingGay.BlackReflection:core:[^"]*|me.weishu:free-reflection:3.0.1|g' {} +
          
          # Hapus baris compiler jika ada
          find . -name "build.gradle" -exec sed -i '/BlackReflection:compiler/d' {} +
          
          # Hapus blok pengecekan variabel yang sering bikin crash CI
          find . -name "build.gradle" -exec sed -i '/if (.*blackReflection)/,/}/d' {} +

      - name: Rebrand Source Code
        run: |
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/top\.niunaijun\.blackbox/com.vmecha.vcore/g' {} +
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/top\/niunaijun\/blackbox/com\/vmecha\/vcore/g' {} +

      - name: Force Inject Namespace & AIDL
        run: |
          find . -name "build.gradle" -not -path "./build.gradle" | while read gradle_file; do
            if grep -q "android {" "$gradle_file"; then
              module_name=$(basename $(dirname "$gradle_file") | tr '-' '_' | tr '[:upper:]' '[:lower:]')
              pkg="com.vmecha.vcore.$module_name"
              sed -i '/namespace /d' "$gradle_file"
              sed -i "/android {/a \    namespace \"$pkg\"" "$gradle_file"
              sed -i "/android {/a \    buildFeatures { aidl true }" "$gradle_file"
            fi
          done

      - name: Setup Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          wget -O gradlew https://github.com/gradle/gradle/raw/v8.0.0/gradlew
          chmod +x gradlew

      - name: Build Bcore AAR
        run: ./gradlew :Bcore:assembleRelease -x lint --stacktrace

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-aar
          path: Bcore/build/outputs/aar/*.aar
